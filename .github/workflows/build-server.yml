name: Build and push server image

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you trigger a rebuild manually from the Actions tab

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # built-in, no setup needed

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        # Image-backed Render services don't auto-redeploy on a registry push. Request the
        # image tagged with this exact commit, rather than whichever image currently owns
        # `latest`, so a deploy can never pick up an older build.
        #
        # The Render service must be image-backed and use
        # ghcr.io/<owner>/<repo>:latest as its default image URL.
        run: >-
          curl -fsS --get
          --data-urlencode "imgURL=ghcr.io/${{ github.repository }}:${{ github.sha }}"
          "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
