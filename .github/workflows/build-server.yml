name: Build and push server image

on:
  push:
    branches: [main]
    paths:
      - "./**"
      - ".github/workflows/build-server.yml"
  workflow_dispatch: {} # lets you trigger a rebuild manually from the Actions tab

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # built-in, no setup needed

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        # Image-backed Render services don't auto-redeploy on a new registry push -- this is
        # the documented way to close that loop from CI. RENDER_DEPLOY_HOOK_URL comes from the
        # service's Settings tab in the Render dashboard.
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"